# Serves the exported demo site (built by the Dockerfile).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off; # behind a proxy (Coolify), keep redirects relative

    # Cross-origin isolation, so Flutter can use multi-threaded skwasm.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    # Flutter's file names don't change between builds, so always revalidate.
    expires -1;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/javascript application/javascript application/json application/wasm text/css image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ \.mjs$ {
        types { text/javascript mjs; }
    }
    location ~ \.wasm$ {
        types { application/wasm wasm; }
    }
}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clock Battery</title>
<meta name="description" content="Measures every clock a page can run an animation on, to find one that beats the browser's frame rate limit.">
<style>
  :root { --bg: #0b0b0d; --surface: #16161a; --text: #f2f2f4; --muted: #a1a1aa; --line: #2a2a31; --accent: #9a8cff; --good: #4ade80; --warn: #fbbf24; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  td.rate { font-weight: 700; }
  .fast { color: var(--good); }
  .slow { color: var(--warn); }
  .note { color: var(--muted); font-size: 13px; }
  button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: #0b0b0d; font: 600 15px system-ui, -apple-system, sans-serif; }
  #status { margin: 12px 0; font-weight: 600; }
  canvas { position: fixed; right: 0; bottom: 0; width: 1px; height: 1px; opacity: .01; }
  .spinner { position: fixed; left: 0; bottom: 0; width: 8px; height: 8px; background: var(--accent); opacity: .01; }
</style>
</head>
<body>
<main>
  <h1>Clock battery</h1>
  <p>Runs one clock at a time for a few seconds each and reports how many ticks a second each one delivers. A clock that beats the page's own frame rate is one an app could render on.</p>
  <div id="status">Starting…</div>
  <table>
    <thead><tr><th>Clock</th><th>Ticks/s</th><th>Between ticks (p50 / p10–p90)</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="note" id="verdict"></p>
  <p><button id="gesture">Run the clocks that need a tap</button></p>
  <p class="note" id="device"></p>
</main>
<canvas id="c" width="1" height="1"></canvas>
<script>
// Each test collects tick timestamps for `window` seconds, one test at a time
// so they don't compete for the main thread, and reports the rate and the
// spread of the gaps. Results are posted to ?log=<url> as they come in, so a
// run needs no interaction (see tool/safari.py).
const params = new URLSearchParams(location.search);
const WINDOW = Number(params.get('seconds')) || 3;
// ?log=<url> is accepted only for this site or the visitor's own machine:
// anything else would let a link send a visitor's browser details to whoever
// wrote it.
const allowedLog = (value) => {
  if (!value) return null;
  try {
    const url = new URL(value, location.href);
    if (url.protocol !== 'http:' && url.protocol !== 'https:') return null;
    const host = url.hostname;
    const local = host === 'localhost' || host === '127.0.0.1' || host === '[::1]' || host.endsWith('.localhost');
    return url.origin === location.origin || local ? url.href : null;
  } catch {
    return null;
  }
};
const log = allowedLog(params.get('log'));
const results = {};

const $ = (id) => document.getElementById(id);
const rows = $('rows');
const quantile = (sorted, p) => (sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(p * sorted.length))] : 0);

function summarize(name, times, note) {
  const gaps = times.slice(1).map((t, i) => t - times[i]).sort((a, b) => a - b);
  const span = times.length > 1 ? times[times.length - 1] - times[0] : 0;
  const result = {
    rate: span > 0 ? ((times.length - 1) * 1000) / span : 0,
    p50: quantile(gaps, 0.5), p10: quantile(gaps, 0.1), p90: quantile(gaps, 0.9),
    ticks: times.length, note: note ?? null,
  };
  results[name] = result;
  show(name, result);
  if (log) navigator.sendBeacon(log, JSON.stringify({ run: params.get('run'), name, ...result, ua: navigator.userAgent, dpr: devicePixelRatio }));
  return result;
}

function show(name, r) {
  const row = document.createElement('tr');
  const fast = r.rate > 75 ? 'fast' : r.rate > 0 ? 'slow' : '';
  row.innerHTML = `<td>${name}${r.note ? `<br><span class="note">${r.note}</span>` : ''}</td>` +
    `<td class="rate ${fast}">${r.rate ? r.rate.toFixed(1) : '—'}</td>` +
    `<td class="note">${r.rate ? `${r.p50.toFixed(2)} / ${r.p10.toFixed(2)}–${r.p90.toFixed(2)} ms` : (r.note ?? 'not available')}</td>`;
  rows.append(row);
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// --- the clocks -------------------------------------------------------------

// The page's own frame clock: what Flutter uses today.
const pageRaf = (seconds) => new Promise((resolve) => {
  const times = [];
  const until = performance.now() + seconds * 1000;
  const step = (t) => { times.push(t); if (performance.now() < until) requestAnimationFrame(step); else resolve(times); };
  requestAnimationFrame(step);
});

// A worker's frame clock, with and without a canvas handed to it. This is the
// clock the Android shim borrows.
const workerRaf = (seconds, withCanvas) => new Promise((resolve) => {
  const source = `
    let times = [], ctx = null;
    onmessage = ({ data }) => {
      if (data.canvas) ctx = data.canvas.getContext('2d');
      if (typeof requestAnimationFrame !== 'function') { postMessage({ unavailable: 'no requestAnimationFrame in workers' }); return; }
      const until = performance.now() + ${seconds} * 1000;
      const step = (t) => {
        times.push(t);
        if (ctx) ctx.fillRect(0, 0, 1, 1);
        if (performance.now() < until) requestAnimationFrame(step); else postMessage({ times });
      };
      requestAnimationFrame(step);
    };`;
  const worker = new Worker(URL.createObjectURL(new Blob([source], { type: 'text/javascript' })));
  worker.onmessage = ({ data }) => { worker.terminate(); resolve(data); };
  worker.onerror = (e) => { worker.terminate(); resolve({ unavailable: e.message || 'worker failed' }); };
  if (withCanvas) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 1;
    const off = canvas.transferControlToOffscreen();
    worker.postMessage({ canvas: off }, [off]);
  } else {
    worker.postMessage({});
  }
});

// Timers: the fastest a page can ask to be called back without a frame clock.
const timers = (seconds, kind) => new Promise((resolve) => {
  const times = [];
  const until = performance.now() + seconds * 1000;
  if (kind === 'timeout') {
    const loop = () => { times.push(performance.now()); if (performance.now() < until) setTimeout(loop, 0); else resolve(times); };
    loop();
  } else if (kind === 'message') {
    const { port1, port2 } = new MessageChannel();
    port1.onmessage = () => { times.push(performance.now()); if (performance.now() < until) port2.postMessage(0); else resolve(times); };
    port2.postMessage(0);
  }
});

// A page whose frame clock is held to 60 can't see whether the screen runs at
// 60 or at 120: both give callbacks 16.7 ms apart. But a callback that runs
// long makes the browser miss its slot, and the next one can only come on a
// real refresh. So the gap after a deliberate overrun is a multiple of the
// refresh interval: about 25 ms on a 120 Hz screen (three refreshes), about
// 33 ms on a 60 Hz one (two). That is the display's rate, read from the one
// place it shows through.
const missProbe = (seconds, blockFor) => new Promise((resolve) => {
  const after = []; // gaps that follow an overrun
  const plain = []; // gaps that don't
  let previous = 0, overran = false, n = 0;
  const until = performance.now() + seconds * 1000;
  const step = (time) => {
    if (previous) (overran ? after : plain).push(time - previous);
    previous = time;
    overran = ++n % 5 === 0;
    if (overran) { const end = performance.now() + blockFor; while (performance.now() < end); }
    if (performance.now() < until) requestAnimationFrame(step);
    else resolve({ after, plain });
  };
  requestAnimationFrame(step);
});

// Committing to a canvas the page has given up (transferControlToOffscreen),
// as fast as a loop can go. If that path pushes back when the display can't
// keep up, the rate it settles at is the display's refresh rate, which is
// otherwise invisible to a page whose own frame clock is capped.
const commitFlood = (seconds) => new Promise((resolve) => {
  const el = document.createElement('canvas');
  el.width = el.height = 64;
  el.style.cssText = 'position:fixed;left:0;top:0;width:64px;height:64px;opacity:.02;pointer-events:none';
  document.body.append(el);
  let off;
  try {
    off = el.transferControlToOffscreen();
  } catch (error) {
    el.remove();
    resolve({ unavailable: String(error) });
    return;
  }
  const ctx = off.getContext('bitmaprenderer');
  const scratch = new OffscreenCanvas(64, 64);
  const sctx = scratch.getContext('2d');
  const times = [];
  const until = performance.now() + seconds * 1000;
  const { port1, port2 } = new MessageChannel();
  let n = 0;
  port1.onmessage = () => {
    sctx.fillStyle = n++ % 2 ? '#fff' : '#000';
    sctx.fillRect(0, 0, 64, 64);
    ctx.transferFromImageBitmap(scratch.transferToImageBitmap());
    times.push(performance.now());
    if (performance.now() < until) port2.postMessage(0);
    else { el.remove(); resolve({ times }); }
  };
  port2.postMessage(0);
});

// How long a chain of setTimeout(delay) actually takes per hop. A browser
// that fires timers whenever they come due lands near the delay asked for; one
// that fires them in step with the screen lands on a multiple of the refresh
// interval, which both says what the refresh interval is and offers a tick
// between two frame-clock callbacks.
const timerChain = (delay, hops) => new Promise((resolve) => {
  const times = [];
  const loop = () => {
    times.push(performance.now());
    if (times.length <= hops) setTimeout(loop, delay);
    else resolve(times);
  };
  setTimeout(loop, delay);
});

// The audio render thread: 128 frames per callback at the device's sample
// rate, independent of the display. Needs a user gesture to start.
const audioClock = (seconds) => new Promise(async (resolve) => {
  // Safari never settles resume()'s promise until a gesture has happened, so
  // nothing here may be awaited without a way out.
  const withTimeout = (promise, ms, what) => Promise.race([
    promise, new Promise((_, reject) => setTimeout(() => reject(new Error(`${what} did not finish in ${ms} ms (needs a tap?)`)), ms)),
  ]);
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    await withTimeout(ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([`
      class Tick extends AudioWorkletProcessor {
        process() { this.port.postMessage(currentTime); return true; }
      }
      registerProcessor('tick', Tick);`], { type: 'text/javascript' }))), 2000, 'loading the worklet');
    await withTimeout(ctx.resume(), 1500, 'starting the audio context');
    if (ctx.state !== 'running') { ctx.close(); resolve({ unavailable: `audio context ${ctx.state} (needs a tap)` }); return; }
    const node = new AudioWorkletNode(ctx, 'tick');
    const times = [];
    node.port.onmessage = () => times.push(performance.now());
    node.connect(ctx.destination);
    await sleep(seconds * 1000);
    node.disconnect();
    ctx.close();
    resolve({ times, note: `${ctx.sampleRate} Hz sample rate, 128-frame quanta` });
  } catch (error) {
    resolve({ unavailable: String(error) });
  }
});

// --- the run ----------------------------------------------------------------

// A composited CSS animation runs on the compositor, not the page's frame
// clock. If the page's clock speeds up while one runs, a Flutter app could
// keep one running to lift its own rate.
const spinner = () => {
  const el = document.createElement('div');
  el.className = 'spinner';
  el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(40px)' }], { duration: 400, iterations: Infinity });
  document.body.append(el);
  return el;
};

async function run() {
  $('device').textContent = `${navigator.userAgent} · ${screen.width}×${screen.height} @${devicePixelRatio}x`;

  const step = async (label, fn) => {
    $('status').textContent = `Measuring: ${label}…`;
    await sleep(150);
    return fn();
  };

  summarize('page requestAnimationFrame', await step('page frame clock', () => pageRaf(WINDOW)));

  const spin = spinner();
  summarize('page requestAnimationFrame, with a composited animation running',
    await step('page frame clock next to a compositor animation', () => pageRaf(WINDOW)));
  spin.remove();

  for (const withCanvas of [true, false]) {
    const label = `worker requestAnimationFrame${withCanvas ? ', canvas handed over' : ', no canvas'}`;
    const data = await step(label, () => workerRaf(WINDOW, withCanvas));
    if (data.unavailable) summarize(label, [], data.unavailable);
    else summarize(label, data.times);
  }

  summarize('setTimeout(0) loop', await step('setTimeout', () => timers(WINDOW, 'timeout')));
  summarize('MessageChannel loop', await step('MessageChannel', () => timers(1, 'message')));

  for (const block of [20, 28]) {
    const { after, plain } = await step(`frame clock after a ${block} ms overrun`, () => missProbe(WINDOW, block));
    // Reported as intervals, so the table's p50 column is the gap itself.
    const asTimes = (gaps) => gaps.reduce((times, gap) => [...times, times[times.length - 1] + gap], [0]);
    summarize(`gap after a ${block} ms overrun`, asTimes(after.sort((a, b) => a - b)),
      `${after.length} overruns; the refresh interval divides this`);
    summarize(`gap with no overrun (${block} ms run)`, asTimes(plain.sort((a, b) => a - b)), `${plain.length} frames`);
  }

  for (const delay of [1, 4, 5, 8, 10, 12]) {
    summarize(`setTimeout(${delay}) chain`, await step(`setTimeout(${delay})`, () => timerChain(delay, 60)));
  }

  const flood = await step('flooding a handed-over canvas', () => commitFlood(WINDOW));
  if (flood.unavailable) summarize('commits to a handed-over canvas, unpaced', [], flood.unavailable);
  else summarize('commits to a handed-over canvas, unpaced', flood.times);

  const audio = await step('audio worklet', () => audioClock(WINDOW));
  if (audio.unavailable) summarize('audio worklet (128-frame quanta)', [], audio.unavailable);
  else summarize('audio worklet (128-frame quanta)', audio.times, audio.note);

  const page = results['page requestAnimationFrame']?.rate ?? 0;
  const faster = Object.entries(results).filter(([, r]) => r.rate > page * 1.3 && r.rate > 75).map(([n]) => n);
  $('verdict').textContent = page > 100
    ? `The page's own frame clock runs at ${page.toFixed(0)} ticks a second here, so an app can render at full rate without any trick.`
    : faster.length
      ? `Faster than the page's ${page.toFixed(0)}/s: ${faster.join('; ')}.`
      : `Nothing beat the page's ${page.toFixed(0)} ticks a second.`;
  $('status').textContent = 'Done.';
  if (log) navigator.sendBeacon(log, JSON.stringify({ run: params.get('run'), name: 'done', verdict: $('verdict').textContent }));
}

$('gesture').addEventListener('click', async () => {
  const audio = await audioClock(WINDOW);
  if (audio.unavailable) summarize('audio worklet (after a tap)', [], audio.unavailable);
  else summarize('audio worklet (after a tap)', audio.times, audio.note);
});

run();
</script>
</body>
</html>
